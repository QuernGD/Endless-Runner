name: Build EndlessRunner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned Archive
        run: |
          xcodebuild archive \
            -project EndlessRunner.xcodeproj \
            -scheme EndlessRunner \
            -archivePath EndlessRunner.xcarchive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r EndlessRunner.xcarchive/Products/Applications/EndlessRunner.app Payload/
          zip -qr EndlessRunner.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndlessRunner-IPA
          path: EndlessRunner.ipa

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EndlessRunner Build ${{ github.run_number }}
          files: EndlessRunner.ipa
          draft: true
